<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio PRO</title>

<link rel="manifest" href="manifest.json">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  background:#020617;
  padding:15px 20px;
  z-index:999;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,0.08);
}


/* GRID */
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  padding:10px;
  margin-bottom:90px;
}

.card{
  background:#1e293b;
  padding:5px;
  border-radius:12px;
  cursor:pointer;
}

/* PLAYER */
.player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#020617;
  padding:10px;
}

.cover{
  height:50px;
  width:50px;
  border-radius:8px;
  background:#333;
  margin-right:10px;
}

.player-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.info{
  display:flex;
  align-items:center;
  gap:10px;
}

button{
  background:black;
  border:none;
  padding:5px;
  border-radius:8px;
  color:white;
  font-weight:bold;
  border:1px solid white;
}

/* ANIMAÇÃO */
.playing{
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}
.logo{
  font-size:18px;
  font-weight:bold;
  letter-spacing:1px;
}

.badge{
  background:#1e293b;
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
}


</style>
</head>

<body>
<label for="nome" style="font-size: 8px; margin-left: 10px">© 2026 Leonildo.Neumann</label>
<header><div class="logo">🎧 Radio PRO 📻</div>
  <div class="badge"><a href="index.html" style="color:yellow; text-decoration: none">🌦️ Tempo</a></div>
</header>
<div style="padding:10px; display:flex; gap:10px;">
<input 
    id="busca" 
    placeholder="Buscar rádio ou gênero..." 
    oninput="buscarRadio(); autocomplete();"
    style="flex:1; padding:5px 8px; border-radius:10px; border:none; font-weight:bold; font-size:17px"
  >
</div>

<div style="padding:10px; display:flex; gap:10px;">
  
<button onclick="mostrarHistorico()" style="background:blue">🕘 Histórico</button>
<button onclick="mostrarFavoritos()">❤️ Favoritos</button>
<div id="sugestoes" style="
  position:absolute;
  background:#1e293b;
  width:90%;
  max-height:200px;
  overflow:auto;
  border-radius:10px;">
</div>
<div style="margin-top:5px; display:flex; gap:5px;">
  
  <select onchange="definirTimer(this.value)" style="flex:1; border-radius:8px;">
    <option value="">⏱️ Sleep Timer</option>
    <option value="900">15 minutos</option>
    <option value="1800">30 minutos</option>
    <option value="3600">1 hora</option>
    <option value="7200">2 hora</option>
  </select>

  <button onclick="cancelarTimer()"style="background:red">Cancelar Timer</button>

</div>

</div>

<div class="container" id="lista"></div>

<div class="player">
  <div class="player-top">
    
    <div class="info">
      <div class="cover" id="cover"></div>
      <div>
        <div id="radioNome">Nenhuma rádio</div>
        <small id="musica">---</small>
      </div>
    </div>
    <button id="btnFav" onclick="toggleFavoritoAtual()" style="font-size:17px; padding:3px">🤍</button>
    <button onclick="toggle()" style="font-size:17px; padding:3px; background:white">▶️</button>
  </div>

  <input type="range" min="0" max="1" step="0.01" onchange="audio.volume=this.value">
</div>

<audio id="audio"></audio>

<script>
const lista = document.getElementById("lista");
const audio = document.getElementById("audio");

let historico = JSON.parse(localStorage.getItem("hist")) || [];
let radioAtual = null;

/* API */
async function carregar(){
  const res = await fetch("https://de1.api.radio-browser.info/json/stations/bycountry/brazil?limit=70&hidebroken=true&order=clickcount&reverse=true");
  const data = await res.json();

  render(data);
}

let timeout;

function buscarRadio(){
  clearTimeout(timeout);

  timeout = setTimeout(async ()=>{
    const termo = document.getElementById("busca").value;

    if(termo.length < 2){
      carregar();
      return;
    }

    const res = await fetch(`https://de1.api.radio-browser.info/json/stations/search?name=${termo}&countrycode=BR&limit=70&order=clickcount&reverse=true`);
    const data = await res.json();

    render(data);
  }, 400);
}

/* RENDER */
function render(radios){
  lista.innerHTML="";

  const favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

  radios.forEach((r, index)=>{
    const isFav = favoritos.some(f => f.url_resolved === r.url_resolved);

    const div = document.createElement("div");
    div.className="card";

    div.innerHTML = `
      <strong>${r.name}</strong>
      <br>
      <button onclick="event.stopPropagation(); toggleFavorito(${index})" style="font-size:17px; padding:3px">
        ${isFav ? "❤️" : "🤍"}
      </button>
    `;

    div.onclick = ()=>playRadio(r);

    lista.appendChild(div);
  });

  window.radiosAtuais = radios;
}

/* PLAY */
function playRadio(r){
  radioAtual = r;

  audio.src = r.url_resolved;
  audio.play();

  document.getElementById("radioNome").innerText = r.name;

  // histórico
  let hist = JSON.parse(localStorage.getItem("historico")) || [];
  hist.unshift(r);
  hist = hist.slice(0,10);

  localStorage.setItem("historico", JSON.stringify(hist));
  localStorage.setItem("ultima", JSON.stringify(r));

  atualizarBotaoFav();
}

/* PLAY/PAUSE */
function toggle(){
  if(audio.paused){
    audio.play();
  }else{
    audio.pause();
  }
}

/* BOTÃO PLAYER ▶️ ⏸️ */
audio.addEventListener("play", ()=>{
  document.getElementById("btnPlay").innerText = "⏸️";
});

audio.addEventListener("pause", ()=>{
  document.getElementById("btnPlay").innerText = "▶️";
});

/* FAVORITOS (CARD + PLAYER) */
function toggleFavorito(index){
  const radio = window.radiosAtuais[index];

  let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

  const existe = favoritos.find(r => r.url_resolved === radio.url_resolved);

  if(existe){
    favoritos = favoritos.filter(r => r.url_resolved !== radio.url_resolved);
  }else{
    favoritos.unshift(radio);
  }

  localStorage.setItem("favoritos", JSON.stringify(favoritos));

  render(window.radiosAtuais);
  atualizarBotaoFav();
}

/* FAVORITO PELO PLAYER */
function toggleFavoritoAtual(){
  if(!radioAtual) return;

  let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

  const existe = favoritos.find(r => r.url_resolved === radioAtual.url_resolved);

  if(existe){
    favoritos = favoritos.filter(r => r.url_resolved !== radioAtual.url_resolved);
  }else{
    favoritos.unshift(radioAtual);
  }

  localStorage.setItem("favoritos", JSON.stringify(favoritos));

  atualizarBotaoFav();
  render(window.radiosAtuais || []);
}

/* ATUALIZA ÍCONE DO PLAYER */
function atualizarBotaoFav(){
  if(!radioAtual) return;

  const favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

  const isFav = favoritos.some(r => r.url_resolved === radioAtual.url_resolved);

  document.getElementById("btnFav").innerText = isFav ? "❤️" : "🤍";
}

/* METADADOS */
audio.addEventListener("timeupdate", ()=>{
  if(audio.metadata){
    document.getElementById("musica").innerText = audio.metadata.title;
  }
});

/* PWA */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}

/* AUTOLOAD */
carregar();

/* AUTOCOMPLETE */
async function autocomplete(){
  const termo = document.getElementById("busca").value;

  if(termo.length < 2){
    document.getElementById("sugestoes").innerHTML="";
    return;
  }

  const res = await fetch(`https://de1.api.radio-browser.info/json/stations/search?name=${termo}&limit=5`);
  const data = await res.json();

  let html = "";

  data.forEach(r=>{
    html += `<div onclick='selecionarSugestao("${r.name}")' style="padding:8px; cursor:pointer;">
      ${r.name}
    </div>`;
  });

  document.getElementById("sugestoes").innerHTML = html;
}

function selecionarSugestao(nome){
  document.getElementById("busca").value = nome;
  document.getElementById("sugestoes").innerHTML="";
  buscarRadio();
}

/* HISTÓRICO */
function mostrarHistorico(){
  const hist = JSON.parse(localStorage.getItem("historico")) || [];
  render(hist);
}

/* FAVORITOS */
function mostrarFavoritos(){
  const favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
  render(favoritos);
}

/* LOAD */
window.onload = ()=>{
  carregar();

  const ultima = JSON.parse(localStorage.getItem("ultima"));
  if(ultima){
    document.getElementById("radioNome").innerText = ultima.name;
  }
}

/* SLEEP TIMER */
let timerSleep = null;

function definirTimer(segundos){
  cancelarTimer();

  if(!segundos) return;

  timerSleep = setTimeout(()=>{
    audio.pause();
    alert("⏱️ Rádio desligada automaticamente");
  }, segundos * 1000);
}

function cancelarTimer(){
  if(timerSleep){
    clearTimeout(timerSleep);
    timerSleep = null;
  }
}
</script>
</body>
</html>
