<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clima App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0a0e1a;
  --bg-secondary: #111827;
  --glass: rgba(255,255,255,0.06);
  --glass-strong: rgba(255,255,255,0.1);
  --glass-border: rgba(255,255,255,0.08);
  --accent: #38bdf8;
  --accent-glow: rgba(56,189,248,0.2);
  --accent-warm: #f59e0b;
  --accent-danger: #ef4444;
  --accent-rain: #6366f1;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #e0e3e7;
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
  --shadow-md: 0 8px 32px rgba(0,0,0,0.3);
  --shadow-lg: 0 16px 48px rgba(0,0,0,0.4);
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  background: linear-gradient(160deg, #0f172a 0%, #0f172a 0%, #0f172a 100%);
  background-size: 300% 300%;
  transition: background 1.2s ease;
}

/* ====== AMBIENT ORBS ====== */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.5;
  transition: all 1.5s ease;
}
.orb-1 {
  width: 400px; height: 400px;
  top: -10%; right: -10%;
  background: radial-gradient(circle, rgba(56,189,248,0.12), transparent 70%);
  animation: orb-float 12s ease-in-out infinite alternate;
}
.orb-2 {
  width: 300px; height: 300px;
  bottom: 10%; left: -8%;
  background: radial-gradient(circle, rgba(99,102,241,0.1), transparent 70%);
  animation: orb-float 10s ease-in-out infinite alternate-reverse;
}
@keyframes orb-float {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(30px, -20px) scale(1.1); }
}

/* ====== CONTAINER ====== */
.app {
  position: relative;
  z-index: 1;
  max-width: 460px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

/* ====== CARD ====== */
.card {
  background: var(--glass);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-md);
  transition: var(--transition);
  animation: card-in 0.5s ease-out both;
}
.card:hover { border-color: rgba(255,255,255,0.12); }

@keyframes card-in {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ====== HEADER ====== */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding: 0 2px;
}
.app-logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.app-logo svg { color: var(--accent); }
.app-logo span {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.btn-unit {
  display: flex;
  align-items: center;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 100px;
  padding: 3px;
  cursor: pointer;
}
.btn-unit button {
  padding: 6px 14px;
  border: none;
  border-radius: 100px;
  font-family: var(--font);
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  background: transparent;
  color: var(--text-muted);
}
.btn-unit button.active {
  background: var(--accent);
  color: #000;
}

/* ====== SEARCH ====== */
.search-card {
  display: flex;
  gap: 10px;
  align-items: center;
}
.search-wrap {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
}
.search-wrap svg {
  position: absolute;
  left: 14px;
  color: var(--text-muted);
  pointer-events: none;
  transition: var(--transition);
}
.search-input {
  width: 100%;
  padding: 13px 14px 13px 44px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: rgba(255,255,255,0.04);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 0.9rem;
  font-weight: 500;
  outline: none;
  transition: var(--transition);
}
.search-input::placeholder { color: var(--text-muted); font-weight: 400; }
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.search-input:focus ~ svg { color: var(--accent); }

.btn-icon {
  width: 46px;
  height: 46px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: rgba(255,255,255,0.04);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
  flex-shrink: 0;
}
.btn-icon:hover {
  background: rgba(56,189,248,0.12);
  border-color: rgba(56,189,248,0.3);
  color: var(--accent);
}
.btn-icon:active { transform: scale(0.94); }

/* ====== CURRENT WEATHER ====== */
.weather-hero {
  text-align: center;
  padding: 28px 18px 22px;
}
.weather-city {
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.weather-icon-large {
  width: 88px;
  height: 88px;
  margin: 12px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.weather-icon-large svg {
  width: 72px;
  height: 72px;
  color: var(--accent);
  filter: drop-shadow(0 0 20px var(--accent-glow));
  animation: icon-breathe 3s ease-in-out infinite;
}
@keyframes icon-breathe {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px var(--accent-glow)); }
  50% { transform: scale(1.06); filter: drop-shadow(0 0 30px var(--accent-glow)); }
}
.weather-temp {
  font-size: 4.5rem;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.04em;
  margin: 8px 0 4px;
  background: linear-gradient(135deg, var(--text-primary) 30%, var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.weather-desc {
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.weather-details-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 16px;
}
.weather-detail {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  color: var(--text-muted);
}
.weather-detail svg { color: var(--text-secondary); flex-shrink: 0; }

.btn-fav-main {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 18px;
  padding: 8px 20px;
  border-radius: 100px;
  border: 1px solid var(--glass-border);
  background: rgba(255,255,255,0.04);
  color: var(--text-secondary);
  font-family: var(--font);
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
}
.btn-fav-main:hover {
  background: rgba(245,158,11,0.12);
  border-color: rgba(245,158,11,0.3);
  color: var(--accent-warm);
}
.btn-fav-main.faved {
  background: rgba(245,158,11,0.1);
  border-color: rgba(245,158,11,0.25);
  color: var(--accent-warm);
}
.btn-fav-main svg { transition: var(--transition); }

/* ====== STATS GRID ====== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.stat-item {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  padding: 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: var(--transition);
}
.stat-item:hover { background: rgba(255,255,255,0.06); }
.stat-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.stat-icon svg { width: 18px; height: 18px; }
.stat-icon.blue { background: rgba(56,189,248,0.1); color: var(--accent); }
.stat-icon.indigo { background: rgba(99,102,241,0.1); color: #818cf8; }
.stat-icon.amber { background: rgba(245,158,11,0.1); color: var(--accent-warm); }
.stat-icon.rose { background: rgba(244,63,94,0.1); color: #fb7185; }
.stat-icon.emerald { background: rgba(16,185,129,0.1); color: #34d399; }
.stat-icon.cyan { background: rgba(6,182,212,0.1); color: #22d3ee; }
.stat-label {
  font-size: 0.7rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 2px;
}
.stat-value {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
}

/* ====== CHART ====== */
.chart-card {
  background: rgba(255,255,255,0.95);
  border: none;
  padding: 18px 14px 10px;
  border-radius: var(--radius-md);
}
.chart-title {
  font-size: 0.78rem;
  font-weight: 600;
  color: #475569;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ====== FORECAST ====== */
.section-title {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title svg { color: var(--accent); }

.forecast-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.forecast-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 14px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.03);
  border: 1px solid transparent;
  transition: var(--transition);
}
.forecast-item:hover {
  background: rgba(255,255,255,0.06);
  border-color: var(--glass-border);
}
.forecast-item.today {
  background: rgba(56,189,248,0.06);
  border-color: rgba(56,189,248,0.15);
}
.forecast-day {
  flex: 1;
  min-width: 0;
}
.forecast-day-name {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-primary);
}
.forecast-day-date {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 1px;
}
.forecast-icon { width: 32px; height: 32px; color: var(--text-secondary); flex-shrink: 0; }
.forecast-temps {
  text-align: right;
  flex-shrink: 0;
}
.forecast-high {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text-primary);
}
.forecast-low {
  font-size: 0.78rem;
  color: var(--text-muted);
}
.forecast-rain {
  font-size: 0.7rem;
  color: #d9dcfc;
  display: flex;
  align-items: center;
  gap: 3px;
  justify-content: flex-end;
  margin-top: 2px;
}

/* ====== FAVORITES ====== */
.fav-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.fav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.03);
  border: 1px solid transparent;
  transition: var(--transition);
  cursor: pointer;
}
.fav-item:hover {
  background: rgba(255,255,255,0.06);
  border-color: var(--glass-border);
}
.fav-city-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 0.85rem;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  padding: 2px 0;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.fav-city-btn span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.fav-remove {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
  flex-shrink: 0;
}
.fav-remove:hover {
  background: rgba(239,68,68,0.12);
  color: var(--accent-danger);
}

.empty-fav {
  text-align: center;
  padding: 20px;
  color: var(--text-muted);
  font-size: 0.82rem;
}

/* ====== LOADING ====== */
.loading-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}
.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--glass-border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ====== TOAST ====== */
.toast-container {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  width: 90%;
  max-width: 400px;
}
.toast {
  background: var(--bg-secondary);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-primary);
  box-shadow: var(--shadow-lg);
  animation: toast-in 0.3s ease-out, toast-out 0.3s ease-in 2.7s forwards;
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: auto;
  width: 100%;
  text-align: center;
  justify-content: center;
}
.toast.warn { border-left: 3px solid var(--accent-warm); }
.toast.success { border-left: 3px solid #34d399; }
.toast.error { border-left: 3px solid var(--accent-danger); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translateY(-12px); } }

/* ====== SCROLLBAR ====== */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

/* ====== RESPONSIVE ====== */
@media (max-width: 480px) {
  .app { padding: 14px 10px 36px; }
  .card { padding: 14px; }
  .weather-temp { font-size: 3.6rem; }
  .weather-icon-large svg { width: 60px; height: 60px; }
  .stats-grid { gap: 8px; }
  .stat-item { padding: 12px; }
  .weather-details-row { gap: 14px; flex-wrap: wrap; }
}
@media (min-width: 600px) {
  .app { padding-top: 32px; }
}
</style>
</head>
<body>

<div class="orb orb-1" id="orb1"></div>
<div class="orb orb-2" id="orb2"></div>

<div class="toast-container" id="toasts"></div>

<div class="app">

  <!-- Header -->
  <div class="app-header">
    <div class="app-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
      <span>Clima</span>
    </div>
    <div class="btn-unit" id="unitToggle">
      <button class="active" onclick="setUnit('C', this)">°C</button>
      <button onclick="setUnit('F', this)">°F</button>
    </div>
  </div>

  <!-- Search -->
  <div class="card search-card" style="animation-delay:0.05s">
    <div class="search-wrap">
      <input class="search-input" id="search" placeholder="Buscar cidade..." onkeydown="if(event.key==='Enter')buscar()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
    <button class="btn-icon" onclick="buscar()" aria-label="Buscar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
    <button class="btn-icon" onclick="gps()" aria-label="Localizacao">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
    </button>
  </div>

  <!-- Current Weather -->
  <div class="card weather-hero" id="heroCard" style="animation-delay:0.1s">
    <div id="weatherContent">
      <div class="loading-state">
        <div class="spinner"></div>
        <div>Obtendo localizacao...</div>
      </div>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="card" id="statsCard" style="display:none; animation-delay:0.15s">
    <div class="stats-grid" id="statsGrid"></div>
  </div>

  <!-- Chart -->
  <div class="card chart-card" id="chartCard" style="display:none; animation-delay:0.2s">
    <div class="chart-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      Precipitacao - Proximas 12 horas
    </div>
    <canvas id="grafico"></canvas>
  </div>

  <!-- Forecast -->
  <div class="card" id="forecastCard" style="display:none; animation-delay:0.25s">
    <div class="section-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
      Previsao 5 dias
    </div>
    <div class="forecast-list" id="forecast"></div>
  </div>

  <!-- Favorites -->
  <div class="card" style="animation-delay:0.3s">
    <div class="section-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Favoritos
    </div>
    <div class="fav-list" id="listaFav"></div>
  </div>

</div>

<script>
let cidadeAtual = "";
let chart;
let unit = "C";
let lastData = null;

/* ====== TEMPERATURE HELPERS ====== */
function toF(c) { return Math.round(c * 9 / 5 + 32); }
function displayTemp(c) {
  return unit === "F" ? toF(c) + "°F" : Math.round(c) + "°C";
}

/* ====== TOAST ====== */
function toast(msg, type = 'warn') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  document.getElementById('toasts').appendChild(el);
  el.textContent = msg;
  setTimeout(() => el.remove(), 3200);
}

/* ====== WEATHER ICONS ====== */
function getWeatherIcon(code, size = 32) {
  const s = size;
  // WMO Weather codes
  if (code === 0) return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
  if (code <= 3) return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M2 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><circle cx="12" cy="12" r="4"/><path d="M16 8a4 4 0 0 1 0 8"/><path d="M2 20h20"/></svg>`;
  if (code <= 48) return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>`;
  if (code <= 57) return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 19v2"/><path d="M12 19v2"/><path d="M16 19v2"/></svg>`;
  if (code <= 67) return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 15h.01"/><path d="M12 15h.01"/><path d="M16 15h.01"/><path d="M10 19h.01"/><path d="M14 19h.01"/></svg>`;
  if (code <= 77) return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 15h8"/><path d="M8 19h8"/><path d="M12 17v4"/></svg>`;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="m22 22-5-5"/></svg>`;
}

function getWeatherDesc(code) {
  if (code === 0) return "Ceu limpo";
  if (code <= 3) return "Parcialmente nublado";
  if (code <= 48) return "Neblina";
  if (code <= 57) return "Garoa";
  if (code <= 67) return "Chuva";
  if (code <= 77) return "Neve";
  return "Tempestade";
}

/* ====== BACKGROUND THEMES ====== */
function setFundo(code) {
  const orb1 = document.getElementById('orb1');
  const orb2 = document.getElementById('orb2');

  if (code === 0) {
    document.body.style.background = "linear-gradient(160deg, #0c4a6e 0%, #0284c7 50%, #0369a1 100%)";
    orb1.style.background = "radial-gradient(circle, rgba(56,189,248,0.18), transparent 70%)";
    orb2.style.background = "radial-gradient(circle, rgba(14,165,233,0.12), transparent 70%)";
    document.documentElement.style.setProperty('--accent', '#38bdf8');
    document.documentElement.style.setProperty('--accent-glow', 'rgba(56,189,248,0.25)');
  } else if (code <= 3) {
    document.body.style.background = "linear-gradient(160deg, #1e293b 0%, #334155 50%, #1e293b 100%)";
    orb1.style.background = "radial-gradient(circle, rgba(148,163,184,0.12), transparent 70%)";
    orb2.style.background = "radial-gradient(circle, rgba(100,116,139,0.1), transparent 70%)";
    document.documentElement.style.setProperty('--accent', '#94a3b8');
    document.documentElement.style.setProperty('--accent-glow', 'rgba(148,163,184,0.2)');
  } else if (code < 60) {
    document.body.style.background = "linear-gradient(160deg, #0f172a 0%, #1e293b 40%, #312e81 100%)";
    orb1.style.background = "radial-gradient(circle, rgba(99,102,241,0.15), transparent 70%)";
    orb2.style.background = "radial-gradient(circle, rgba(129,140,248,0.1), transparent 70%)";
    document.documentElement.style.setProperty('--accent', '#818cf8');
    document.documentElement.style.setProperty('--accent-glow', 'rgba(129,140,248,0.2)');
  } else if (code <= 67) {
    document.body.style.background = "linear-gradient(160deg, #0c0a1a 0%, #1e1b4b 50%, #172554 100%)";
    orb1.style.background = "radial-gradient(circle, rgba(99,102,241,0.18), transparent 70%)";
    orb2.style.background = "radial-gradient(circle, rgba(56,189,248,0.1), transparent 70%)";
    document.documentElement.style.setProperty('--accent', '#6366f1');
    document.documentElement.style.setProperty('--accent-glow', 'rgba(99,102,241,0.25)');
  } else {
    document.body.style.background = "linear-gradient(160deg, #0a0a0f 0%, #111827 50%, #0f172a 100%)";
    orb1.style.background = "radial-gradient(circle, rgba(100,116,139,0.1), transparent 70%)";
    orb2.style.background = "radial-gradient(circle, rgba(71,85,105,0.08), transparent 70%)";
    document.documentElement.style.setProperty('--accent', '#64748b');
    document.documentElement.style.setProperty('--accent-glow', 'rgba(100,116,139,0.15)');
  }
  document.body.style.backgroundSize = '300% 300%';
}

/* ====== FAVORITES ====== */
function favoritar() {
  if (!cidadeAtual) return;
  let fav = JSON.parse(localStorage.getItem("climaFav")) || [];
  if (!fav.includes(cidadeAtual)) {
    fav.push(cidadeAtual);
    localStorage.setItem("climaFav", JSON.stringify(fav));
    toast("Cidade adicionada aos favoritos", "success");
  }
  renderFav();
  updateFavBtn();
}

function removerFavorito(nome) {
  let fav = JSON.parse(localStorage.getItem("climaFav")) || [];
  fav = fav.filter(c => c !== nome);
  localStorage.setItem("climaFav", JSON.stringify(fav));
  toast("Removida dos favoritos", "warn");
  renderFav();
  updateFavBtn();
}

function updateFavBtn() {
  const btn = document.getElementById('favBtn');
  if (!btn || !cidadeAtual) return;
  const fav = JSON.parse(localStorage.getItem("climaFav")) || [];
  const isFav = fav.includes(cidadeAtual);
  btn.classList.toggle('faved', isFav);
  btn.innerHTML = isFav
    ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Salvo nos favoritos`
    : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Favoritar cidade`;
}

function renderFav() {
  let fav = JSON.parse(localStorage.getItem("climaFav")) || [];
  const el = document.getElementById("listaFav");
  el.innerHTML = "";

  if (fav.length === 0) {
    el.innerHTML = '<div class="empty-fav">Nenhuma cidade favoritada</div>';
    return;
  }

  fav.forEach(c => {
    const row = document.createElement("div");
    row.className = "fav-item";

    row.innerHTML = `
      <button class="fav-city-btn" onclick="buscarPorNome('${c.replace(/'/g, "\\'")}')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted);flex-shrink:0"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
        <span>${c}</span>
      </button>
      <button class="fav-remove" onclick="event.stopPropagation(); removerFavorito('${c.replace(/'/g, "\\'")}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
      </button>`;

    el.appendChild(row);
  });
}

/* ====== SEARCH ====== */
async function buscar() {
  const nome = document.getElementById("search").value.trim();
  if (!nome) { toast("Digite o nome de uma cidade", "warn"); return; }
  buscarPorNome(nome);
}

async function buscarPorNome(nome) {
  try {
    const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(nome)}&language=pt`);
    const geoData = await geo.json();

    if (!geoData.results || geoData.results.length === 0) {
      toast("Cidade nao encontrada", "error");
      return;
    }

    const { latitude, longitude, name, country } = geoData.results[0];
    const displayName = country ? `${name}, ${country}` : name;
    carregar(latitude, longitude, displayName);
  } catch (e) {
    toast("Erro ao buscar cidade", "error");
  }
}

/* ====== GPS ====== */
function gps() {
  if (!navigator.geolocation) {
    toast("Geolocalizacao nao suportada", "error");
    return;
  }

  document.getElementById('weatherContent').innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <div>Obtendo localizacao...</div>
    </div>`;

  navigator.geolocation.getCurrentPosition(
    p => carregar(p.coords.latitude, p.coords.longitude, "Sua localizacao"),
    () => {
      toast("Nao foi possivel obter sua localizacao", "error");
      document.getElementById('weatherContent').innerHTML = `
        <div class="loading-state">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
          <div>Clique no pin para localizar</div>
        </div>`;
    }
  );
}

/* ====== UNIT TOGGLE ====== */
function setUnit(u, btn) {
  unit = u;
  document.querySelectorAll('.btn-unit button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (lastData) renderWeather(lastData);
}

/* ====== LOAD WEATHER ====== */
async function carregar(lat, lon, nome) {
  document.getElementById('weatherContent').innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <div>Carregando dados meteorologicos...</div>
    </div>`;

  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=precipitation,precipitation_probability,temperature_2m,relativehumidity_2m,windspeed_10m,winddirection_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode,uv_index_max,windspeed_10m_max&timezone=auto`
    );
    const data = await res.json();
    data._cityName = nome;
    data._lat = lat;
    data._lon = lon;
    lastData = data;
    renderWeather(data);
  } catch (e) {
    toast("Erro ao carregar dados do clima", "error");
    document.getElementById('weatherContent').innerHTML = `
      <div class="loading-state">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--accent-danger)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <div>Erro ao carregar. Tente novamente.</div>
      </div>`;
  }
}

/* ====== RENDER WEATHER ====== */
function renderWeather(data) {
  const nome = data._cityName;
  cidadeAtual = nome;
  const cw = data.current_weather;

  setFundo(cw.weathercode);

  // Hero
  document.getElementById('weatherContent').innerHTML = `
    <div class="weather-city">${nome}</div>
    <div class="weather-icon-large">${getWeatherIcon(cw.weathercode, 72)}</div>
    <div class="weather-temp">${displayTemp(cw.temperature)}</div>
    <div class="weather-desc">${getWeatherDesc(cw.weathercode)}</div>
    <button class="btn-fav-main" id="favBtn" onclick="favoritar()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Favoritar cidade
    </button>`;

  // Find current hour index
  const agora = new Date();
  const horaAtual = agora.toISOString().slice(0, 13);
  let index = data.hourly.time.findIndex(t => t.startsWith(horaAtual));
  if (index === -1) index = 0;

  const chuva = data.hourly.precipitation[index] ?? 0;
  const prob = data.hourly.precipitation_probability[index] ?? 0;
  const humidity = data.hourly.relativehumidity_2m[index] ?? 0;
  const windSpeed = data.hourly.windspeed_10m[index] ?? 0;

  // Details row inside hero
  const heroContent = document.querySelector('.weather-hero');
  const detailsRow = document.createElement('div');
  detailsRow.className = 'weather-details-row';
  detailsRow.innerHTML = `
    <div class="weather-detail">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      ${chuva} mm
    </div>
    <div class="weather-detail">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      ${prob}%
    </div>
    <div class="weather-detail">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
      ${humidity}%
    </div>
    <div class="weather-detail">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>
      ${windSpeed} km/h
    </div>`;
  heroContent.querySelector('.btn-fav-main').after(detailsRow);

  // Stats Grid
  const uvMax = data.daily.uv_index_max ? data.daily.uv_index_max[0] : 0;
  const windMax = data.daily.windspeed_10m_max ? data.daily.windspeed_10m_max[0] : 0;
  const precipSum = data.daily.precipitation_sum ? data.daily.precipitation_sum[0] : 0;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-item">
      <div class="stat-icon amber">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </div>
      <div>
        <div class="stat-label">UV Max</div>
        <div class="stat-value">${uvMax}</div>
      </div>
    </div>
    <div class="stat-item">
      <div class="stat-icon blue">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      </div>
      <div>
        <div class="stat-label">Precipitacao</div>
        <div class="stat-value">${precipSum} mm</div>
      </div>
    </div>
    <div class="stat-item">
      <div class="stat-icon indigo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>
      </div>
      <div>
        <div class="stat-label">Vento Max</div>
        <div class="stat-value">${windMax} km/h</div>
      </div>
    </div>
    <div class="stat-item">
      <div class="stat-icon emerald">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <div>
        <div class="stat-label">Umidade</div>
        <div class="stat-value">${humidity}%</div>
      </div>
    </div>`;
  document.getElementById('statsCard').style.display = 'block';

  // Chart
  const horas = data.hourly.time.slice(index, index + 12).map(h => h.split("T")[1].slice(0, 5));
  const chuvaHoras = data.hourly.precipitation.slice(index, index + 12);
  const tempHoras = data.hourly.temperature_2m.slice(index, index + 12);

  document.getElementById('chartCard').style.display = 'block';

  if (chart) chart.destroy();

  const ctx = document.getElementById("grafico").getContext("2d");
  const gradient = ctx.createLinearGradient(0, 0, 0, 200);
  gradient.addColorStop(0, 'rgba(99, 102, 241, 0.2)');
  gradient.addColorStop(1, 'rgba(99, 102, 241, 0.0)');

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: horas,
      datasets: [
        {
          label: 'Temperatura (' + unit + ')',
          data: tempHoras.map(t => unit === 'F' ? toF(t) : t),
          borderColor: '#f59e0b',
          backgroundColor: 'rgba(245, 158, 11, 0.08)',
          borderWidth: 2,
          tension: 0.4,
          fill: true,
          pointRadius: 0,
          pointHoverRadius: 5,
          pointHoverBackgroundColor: '#f59e0b',
          yAxisID: 'y'
        },
        {
          label: 'Precipitacao (mm)',
          data: chuvaHoras,
          borderColor: '#6366f1',
          backgroundColor: gradient,
          borderWidth: 2,
          tension: 0.4,
          fill: true,
          pointRadius: 0,
          pointHoverRadius: 5,
          pointHoverBackgroundColor: '#6366f1',
          yAxisID: 'y1'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: true,
          position: 'top',
          labels: { boxWidth: 10, usePointStyle: true, pointStyle: 'circle', font: { size: 11, family: 'Inter' }, color: '#64748b' }
        },
        tooltip: {
          backgroundColor: '#1e293b',
          titleColor: '#f1f5f9',
          bodyColor: '#94a3b8',
          borderColor: 'rgba(255,255,255,0.1)',
          borderWidth: 1,
          cornerRadius: 8,
          padding: 10,
          titleFont: { family: 'Inter', weight: '600' },
          bodyFont: { family: 'Inter' }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { size: 10, family: 'Inter' }, color: '#94a3b8', maxRotation: 0 }
        },
        y: {
          position: 'left',
          grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false },
          ticks: {
            font: { size: 10, family: 'Inter' }, color: '#f59e0b',
            callback: v => v + '°'
          }
        },
        y1: {
          position: 'right',
          grid: { display: false },
          ticks: {
            font: { size: 10, family: 'Inter' }, color: '#6366f1',
            callback: v => v + ' mm'
          },
          min: 0
        }
      }
    }
  });

  // Forecast
  const forecastEl = document.getElementById("forecast");
  forecastEl.innerHTML = "";
  document.getElementById('forecastCard').style.display = 'block';

  const hoje = new Date().toLocaleDateString("en-CA");
  let inicio = data.daily.time.findIndex(d => d >= hoje);
  if (inicio === -1) inicio = 0;

  const dias = ['Domingo', 'Segunda', 'Terca', 'Quarta', 'Quinta', 'Sexta', 'Sabado'];

  data.daily.time.slice(inicio, inicio + 5).forEach((dia, i) => {
    const real = inicio + i;
    const dataLocal = new Date(dia + "T12:00:00");

    const nomeDia = i === 0 ? "Hoje" : i === 1 ? "Amanha" : dias[dataLocal.getDay()];
    const wCode = data.daily.weathercode ? data.daily.weathercode[real] : 0;

    const item = document.createElement("div");
    item.className = "forecast-item" + (i === 0 ? " today" : "");
    item.innerHTML = `
      <div class="forecast-day">
        <div class="forecast-day-name">${nomeDia}</div>
        <div class="forecast-day-date">${dataLocal.toLocaleDateString("pt-BR", { day: 'numeric', month: 'short' })}</div>
      </div>
      <div class="forecast-icon">${getWeatherIcon(wCode, 28)}</div>
      <div class="forecast-temps">
        <div class="forecast-high">${displayTemp(data.daily.temperature_2m_max[real])}</div>
        <div class="forecast-low">${displayTemp(data.daily.temperature_2m_min[real])}</div>
        <div class="forecast-rain">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
          ${data.daily.precipitation_sum[real]} mm
        </div>
      </div>`;
    forecastEl.appendChild(item);
  });

  updateFavBtn();
  renderFav();
}

/* ====== INIT ====== */
renderFav();

/* Disable context menu */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) || (e.ctrlKey && e.key === 'u')) {
    e.preventDefault();
  }
});
  
</script>
