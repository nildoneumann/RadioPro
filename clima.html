<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clima App</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

body{
  margin:0;
  font-family:'Inter', sans-serif;
  color:#fff;
  background: linear-gradient(160deg,#0f172a,#1e293b);
  transition:0.5s;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card{
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  border-radius:20px;
  padding:15px;
  margin-bottom:10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.top{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
}

button{
  padding:12px;
  border:none;
  border-radius:12px;
  background:white;
  font-weight:600;
  cursor:pointer;
}

.city{
  font-size:22px;
  opacity:0.9;
}

.temp{
  font-size:54px;
  font-weight:600;
  margin:5px 0;
}

.desc{
  font-size:14px;
  opacity:0.8;
}

.forecast-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.forecast-item:last-child{
  border-bottom:none;
}

.icon{
  font-size:20px;
}

.fav{
  margin-top:10px;
  cursor:pointer;
  opacity:0.8;
}
</style></head>

<body>

<div class="container">

<div class="card top">
  <input id="search" placeholder="Buscar cidade...">
  <button onclick="buscar()">🔍</button>
  <button onclick="gps()">📍</button>
</div>

<div class="card">
  <div class="city" id="city">--</div>
  <div class="temp" id="temp">--</div>
  <div id="desc"></div>
  <div class="fav" onclick="favoritar()">⭐ Favoritar</div>
</div>

<div class="card" style="background:white">
  <canvas id="grafico"></canvas>
</div>

<div class="card forecast" id="forecast"></div>

<div class="card">
  <h3>⭐ Favoritos</h3>
  <div id="listaFav"></div>
</div>

</div>

<script>

let cidadeAtual = "";
let chart;

// 🎨 fundo dinâmico
function setFundo(code){
  if(code < 3) document.body.style.background = "linear-gradient(#38bdf8,#0ea5e9)";
  else if(code < 60) document.body.style.background = "#64748b";
  else document.body.style.background = "#1e293b";
}

// ⭐ favoritos
function favoritar(){
  let fav = JSON.parse(localStorage.getItem("fav")) || [];
  if(!fav.includes(cidadeAtual)){
    fav.push(cidadeAtual);
    localStorage.setItem("fav", JSON.stringify(fav));
    renderFav();
  }
}

function renderFav(){
  let fav = JSON.parse(localStorage.getItem("fav")) || [];
  const el = document.getElementById("listaFav");
  el.innerHTML = "";

  fav.forEach(c=>{
    const d = document.createElement("div");
    d.innerText = c;
    d.style.cursor = "pointer";
    d.onclick = ()=>buscarCidade(c);
    el.appendChild(d);
  });
}

// 🔍 buscar cidade
async function buscar(){
  const nome = document.getElementById("search").value;

  const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${nome}`);
  const geoData = await geo.json();

  if(!geoData.results){
    alert("Cidade não encontrada");
    return;
  }

  const {latitude, longitude, name} = geoData.results[0];
  carregar(latitude, longitude, name);
}

// 📍 GPS
function gps(){
  navigator.geolocation.getCurrentPosition(p=>{
    carregar(p.coords.latitude, p.coords.longitude, "Sua localização");
  });
}

// 🌦️ carregar clima
async function carregar(lat, lon, nome){

  const res = await fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=precipitation,precipitation_probability,temperature_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`
  );

  const data = await res.json();

  cidadeAtual = nome;

  // 🔥 data local correta
  const hoje = new Date().toLocaleDateString("en-CA");

  // 🔥 índice da hora mais confiável
  const agora = new Date();
  const horaAtual = agora.toISOString().slice(0,13);
  let index = data.hourly.time.findIndex(t => t.startsWith(horaAtual));
  if(index === -1) index = 0;

  const chuva = data.hourly.precipitation[index] ?? 0;
  const prob = data.hourly.precipitation_probability[index] ?? 0;

  document.getElementById("city").innerText = nome;
  document.getElementById("temp").innerText = data.current_weather.temperature + "°C";
  document.getElementById("desc").innerText = `🌧️ ${chuva} mm | ☔ ${prob}%`;

  setFundo(data.current_weather.weathercode);

  // 📊 gráfico
  const horas = data.hourly.time.slice(index, index+12)
    .map(h=>h.split("T")[1].slice(0,5));

  const chuvaHoras = data.hourly.precipitation.slice(index, index+12);

  if(chart) chart.destroy();

  chart = new Chart(document.getElementById("grafico"),{
  type:"line",
  data:{
    labels:horas,
    datasets:[{
      data:chuvaHoras,
      tension:0.4,
      fill:true
    }]
  },
  options:{
    plugins:{legend:{display:false}},
    scales:{
      x:{grid:{display:false}},
      y:{grid:{color:"#D3D3D3"}}
    }
  }
});

  // 📅 previsão corrigida
  const forecast = document.getElementById("forecast");
  forecast.innerHTML = "<h3>Previsão</h3>";

  let inicio = data.daily.time.findIndex(d => d >= hoje);
  if(inicio === -1) inicio = 0;

  data.daily.time.slice(inicio, inicio+5).forEach((dia,i)=>{
    const real = inicio + i;

    // 🔥 CORREÇÃO PRINCIPAL AQUI
    const dataLocal = new Date(dia + "T00:00:00");

    const nomeDia =
      i === 0 ? "Hoje" :
      i === 1 ? "Amanhã" :
      dataLocal.toLocaleDateString("pt-BR",{weekday:"long"});

    forecast.innerHTML += `
      <div>
        <strong>${nomeDia}</strong><br>
        🌡️ ${Math.round(data.daily.temperature_2m_max[real])}° /
        ${Math.round(data.daily.temperature_2m_min[real])}° |
        🌧️ ${data.daily.precipitation_sum[real]} mm
      </div>
    `;
  });

  renderFav();
}

// iniciar
gps();

function getIcon(code){
  if(code === 0) return "☀️";
  if(code <= 2) return "🌤️";
  if(code <= 3) return "☁️";
  if(code < 60) return "🌫️";
  if(code < 70) return "🌧️";
  if(code < 80) return "🌨️";
  return "⛈️";
}
function setFundo(code){
  if(code === 0)
    document.body.style.background = "linear-gradient(160deg,#38bdf8,#0ea5e9)";
  else if(code <= 3)
    document.body.style.background = "linear-gradient(160deg,#94a3b8,#64748b)";
  else if(code < 60)
    document.body.style.background = "linear-gradient(160deg,#475569,#1e293b)";
  else
    document.body.style.background = "linear-gradient(160deg,#0f172a,#020617)";
}
forecast.innerHTML = "<h3>Previsão</h3>";

let inicio = data.daily.time.findIndex(d => d >= hoje);
if(inicio === -1) inicio = 0;

data.daily.time.slice(inicio, inicio+5).forEach((dia,i)=>{
  const real = inicio + i;

  const dataLocal = new Date(dia + "T00:00:00");

  const nomeDia =
    i===0 ? "Hoje" :
    i===1 ? "Amanhã" :
    dataLocal.toLocaleDateString("pt-BR",{weekday:"long"});

  const icon = getIcon(data.current_weather.weathercode);

  forecast.innerHTML += `
    <div class="forecast-item">
      <div>
        <strong>${nomeDia}</strong><br>
        <span class="desc">${Math.round(data.daily.temperature_2m_max[real])}° / ${Math.round(data.daily.temperature_2m_min[real])}°</span>
      </div>
      <div class="icon">${icon}</div>
      <div>${data.daily.precipitation_sum[real]} mm</div>
    </div>
  `;
});

</script>
</body>
</html>
